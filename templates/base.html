<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Urlaubsplaner</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav><a href="{{ url_for('index') }}">Übersicht</a>{% if current_user.is_authenticated %}<a href="{{ url_for('years') }}">Vergangene Jahre ansehen</a>{% if current_user.has_role('admin') %}<a href="{{ url_for('members') }}">Mitglieder verwalten</a><a href="{{ url_for('upload') }}">Excel hochladen</a>{% endif %}<span>{{ current_user.display_name }}</span><a href="{{ url_for('logout') }}">Abmelden</a>{% endif %}</nav>
{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}{% block body %}{% endblock %}</body></html>
