{% extends 'base.html' %}{% block body %}<h1>Mitglieder verwalten</h1><section><h2>Neuen Nutzer erstellen</h2><form method="post" class="grid"><input type="hidden" name="action" value="create"><input name="username" placeholder="Benutzername" required><input name="first_name" placeholder="Vorname" required><input name="last_name" placeholder="Nachname" required><input name="password" type="password" placeholder="Passwort" required>{% for role in roles %}<label><input type="checkbox" name="roles" value="{{ role }}">{{ role }}</label>{% endfor %}<button>Erstellen</button></form></section><table><tr><th>Name</th><th>Rollen</th><th>Aktionen</th></tr>{% for user in users %}<tr><td>{{ user.last_name }}, {{ user.first_name }}</td><td><form method="post"><input type="hidden" name="action" value="roles"><input type="hidden" name="user_id" value="{{ user.id }}">{% for role in roles %}<label><input type="checkbox" name="roles" value="{{ role }}" {% if role in role_map[user.id] %}checked{% endif %}>{{ role }}</label>{% endfor %}<button>Speichern</button></form></td><td><form method="post" onsubmit="return confirm('Nutzer löschen?')"><input type="hidden" name="action" value="delete"><input type="hidden" name="user_id" value="{{ user.id }}"><button>Löschen</button></form></td></tr>{% endfor %}</table>{% endblock %}
