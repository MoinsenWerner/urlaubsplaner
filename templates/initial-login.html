{% extends 'base.html' %}{% block body %}
<main class="login card">
  <h1>Initiales Passwort ändern</h1>
  <p>Lege vor der ersten Nutzung ein persönliches Passwort fest.</p>
  <form method="post">
    <label>Benutzername <input name="username" value="{{ username }}" required autofocus></label>
    <label>Initialpasswort <input name="initial_password" type="password" value="{{ initial_password }}" required></label>
    <label>Neues Passwort <input name="new_password" type="password" minlength="8" required></label>
    <label>Neues Passwort bestätigen <input name="password_confirmation" type="password" minlength="8" required></label>
    <button>Passwort festlegen</button>
  </form>
</main>
{% endblock %}
