{% extends 'base.html' %}{% block body %}
<main class="login card"><h1>Passwort ändern</h1><form method="post">
  <label>Aktuelles Passwort <input type="password" name="current_password" required></label>
  <label>Neues Passwort <input type="password" name="new_password" minlength="8" required></label>
  <label>Neues Passwort bestätigen <input type="password" name="password_confirmation" minlength="8" required></label>
